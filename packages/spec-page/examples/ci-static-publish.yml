name: publish-spec-page

on:
  push:
    branches: [main]

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Render static spec page
        run: |
          pnpm exec speculator-render \
            --entry specs/index.md \
            --config specs/config.json \
            --out dist/index.html \
            --client-mermaid \
            --client-likec4 \
            --client-mode assets \
            --client-assets-dir assets

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        uses: actions/deploy-pages@v4
